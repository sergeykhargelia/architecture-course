name: Run Tests

on:
  push:

jobs:
  run-unit-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4

    - name: Install requirements
      run: python3 -m pip install install -r requirements.txt

    - name: Run tests
      run: python3 -m unittest -v
